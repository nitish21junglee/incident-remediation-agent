spring.application.name=incident-remediation-agent
server.port=${PORT:8080}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/incident_remediation_agent}
agent.mode=${AGENT_MODE:fixture}
agent.service-id=${PAGERDUTY_SERVICE_ID:PDEMO}
agent.slack.bot-token=${SLACK_BOT_TOKEN:fixture-token}
agent.slack.signing-secret=${SLACK_SIGNING_SECRET:fixture-secret}
agent.slack.channel-id=${SLACK_CHANNEL_ID:}
agent.jira.base-url=${JIRA_BASE_URL:https://example.atlassian.net}
agent.jira.email=${JIRA_EMAIL:demo@example.com}
agent.jira.api-token=${JIRA_API_TOKEN:fixture-token}
agent.jira.project-key=${JIRA_PROJECT_KEY:HACK}
agent.jira.issue-type=${JIRA_ISSUE_TYPE:Task}
agent.splunk.base-url=${SPLUNK_BASE_URL:https://splunk.example}
agent.splunk.token=${SPLUNK_TOKEN:fixture-token}
agent.splunk.query=${SPLUNK_QUERY:search index=demo service=demo-api level=ERROR}
agent.splunk.search-link=${SPLUNK_SEARCH_LINK:https://splunk.example/app/search}
agent.signalfx.realm=${SIGNALFX_REALM:eu0}
agent.signalfx.token=${SIGNALFX_TOKEN:fixture-token}
agent.signalfx.error-program=${SIGNALFX_ERROR_PROGRAM:data('demo.http.errors').sum().publish()}
agent.signalfx.latency-program=${SIGNALFX_LATENCY_PROGRAM:data('demo.http.latency').mean().publish()}
agent.signalfx.dashboard-link=${SIGNALFX_DASHBOARD_LINK:https://app.eu0.signalfx.com/#/dashboard/demo}
# service.name to query when the incident's own service name matches no known SignalFxService.
agent.signalfx.default-service=${SIGNALFX_SERVICE:reward-service}
agent.deployment.version=${DEMO_DEPLOYMENT_VERSION:v1.4.2}
agent.deployment.commit-sha=${DEMO_COMMIT_SHA:abc123}
agent.deployment.commit-url=${DEMO_COMMIT_URL:https://github.com/acme/demo-api/commit/abc123}
agent.deployment.deployed-at=${DEMO_DEPLOYED_AT:2026-08-14T01:55:00Z}
agent.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
agent.ai.api-key=${AI_API_KEY:fixture-token}
agent.ai.default-models=${AI_MODELS:gemini-2.5-flash}
agent.github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
agent.github.token=${GITHUB_TOKEN:fixture-token}
agent.github.branch-prefix=${GITHUB_BRANCH_PREFIX:agent/incident}
# Nothing is written to GitHub unless this is explicitly true. Keep it false until a run has been
# inspected end to end: with it false the agent still reads, proposes and gates, then reports the
# branch and files it would have created.
agent.github.push-enabled=${GITHUB_PUSH_ENABLED:false}
agent.github.max-changed-files=${GITHUB_MAX_CHANGED_FILES:5}
agent.github.protected-paths[0]=.github/workflows/
agent.github.protected-paths[1]=infrastructure/
# Known repositories: short name -> slug, base branch, and the files the model may read and
# rewrite. Acts as an allowlist; a repository absent here can never be read or written, and a file
# absent from context-files can never be rewritten.
agent.github.repositories.darsrftp-service.slug=${GITHUB_REPOSITORY:Flutter-Global/darsrftp-service}
agent.github.repositories.darsrftp-service.base-branch=${GITHUB_BASE_BRANCH:dev}
agent.github.repositories.darsrftp-service.context-files[0]=src/main/java/com/flutter/reward_service/service/KafkaConsumer.java
agent.github.repositories.darsrftp-service.context-files[1]=src/test/java/com/flutter/reward_service/service/KafkaConsumerTest.java

# Which repository owns which PagerDuty service. An unmapped service yields no code investigation.
agent.github.service-repositories.P2UX5VH=darsrftp-service
